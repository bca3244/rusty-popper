# Copy next to rusty-popper.exe as rusty-popper.toml. Everything is optional.

[wheel]
style = "arc"          # "arc" or "flow"; W toggles at runtime

[playfield]
# Degrees clockwise to turn the menu so it faces the player.
# Default: Popper's GlobalSettings.ThumbRotate.
# ui_rotation = 270

[input]
# Extra joystick buttons (1-based, as Popper numbers them) that open the
# exit menu, in addition to Popper's System Menu / Exit bindings.
# menu_joy_buttons = [10]
# letter_prev_joy_buttons = [2]   # jump to the previous starting letter
# letter_next_joy_buttons = [4]   # jump to the next starting letter
# playlist_joy_buttons = []       # open the playlist picker (also in the exit menu, or P)

[attract]
# enabled = true
# idle_secs = 180      # idle time before attract mode starts
# interval_secs = 12   # time on each game in attract mode
