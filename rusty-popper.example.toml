# Copy next to rusty-popper.exe as rusty-popper.toml. Everything is optional.
# Most of these can also be changed in the app: Exit -> Options.

[wheel]
style = "arc"          # "arc" or "flow"; W toggles at runtime

[playfield]
# Degrees clockwise to turn the menu so it faces the player.
# Default: Popper's GlobalSettings.ThumbRotate.
# ui_rotation = 270

[input]
# Buttons come from Popper's controller setup (PinUPFunctions):
#   Game Prior/Next = browse, Page Prior/Next = jump by letter,
#   Game Start = launch, System Menu / Exit Emulators = exit menu,
#   List Next/Prior = playlist picker.
# Only add these to bind extra joystick buttons (Popper numbering, 0-based).
# menu_joy_buttons = []
# letter_prev_joy_buttons = []
# letter_next_joy_buttons = []
# playlist_joy_buttons = []
# Ignore the cabinet buttons while another program covers a screen (a table
# started from VPin Studio, say), so they don't also drive the hidden menu.
# joystick_needs_focus = true
# Q quits at once, without the exit menu. Turn off if a cabinet button sends Q.
# keyboard_quit = true

[launch]
# Helper programs in an emulator's folder that don't mean a game is running,
# on top of the built-in list (dmdext, FPLoader, Steam's own services).
# ignore_processes = ["somehelper.exe"]

[paths]
# Found automatically if not set: the default folder, then where Windows
# has PinUpPlayer registered, then the usual folders on every drive. The
# folder it finds is saved here.
# popper_dir = 'C:\vPinball\PinUPSystem'      # default
# mpv_dll = 'C:\somewhere\libmpv-2.dll'       # default: next to the exe

[attract]
# enabled = true
# idle_secs = 180      # idle time before attract mode starts
# interval_secs = 12   # time on each game in attract mode

[audio]
# volume = 100         # playfield video volume; default from PinUpPlayer.ini

[sound]
# Menu sound effects, from Popper's PUPVideos\PinUpMenu\PuPSounds (fx_*.wav).
# Also in the app: Exit -> Options.
# enabled = true
# volume = 30
# dir = 'C:\vPinball\PinUPSystem\PUPVideos\PinUpMenu\PuPSounds'
# Play the selected game's Audio media (POPMedia\<emulator>\Audio\<game>.mp3)
# once the wheel rests on it for a moment.
# game_audio = true
# game_audio_volume = 50

[update]
# Look for a newer release on GitHub at startup; install from Exit -> Options.
# check = true
# repo = 'bca3244/rusty-popper'
