<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Rusty Popper</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-title" content="Rusty Popper">
<style>
  :root { --bg: #0e1116; --card: #181c24; --line: #2a303c; --text: #eef1f6; --dim: #9aa3b2; --copper: #d08a4e; --danger: #d9534f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--copper); margin: 4px 0 14px; display: flex; justify-content: space-between; }
  h1 small { color: var(--dim); letter-spacing: 0; text-transform: none; font-weight: 400; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .state { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); }
  .state.live { color: #7fd17f; }
  #wheel { display: block; max-width: 70%; max-height: 160px; margin: 12px auto 6px; }
  #title { font-size: 22px; font-weight: 650; margin: 6px 0 2px; }
  #sub { color: var(--dim); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 12px 0 0; font-size: 14px; }
  dt { color: var(--dim); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .tags span { display: inline-block; background: #262c38; border-radius: 10px; padding: 1px 9px; margin: 0 4px 4px 0; font-size: 13px; }
  button { width: 100%; min-height: 52px; margin: 6px 0; border-radius: 12px; border: 1px solid var(--line); background: #222834; color: var(--text); font: inherit; font-weight: 600; }
  button.power { border-color: #5a2a2a; }
  button.armed { background: var(--danger); border-color: var(--danger); color: #fff; }
  button:disabled { opacity: .5; }
  #msg { min-height: 1.4em; color: var(--dim); text-align: center; font-size: 14px; }
  #msg.err { color: #ff8a80; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); margin: 14px 0 6px; font-weight: 600; }
  h2:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
  .row label { flex: 1; white-space: nowrap; }
  .row[hidden] { display: none; }
.row output { min-width: 3.2em; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  select { background: #222834; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; }
  input[type=range] { flex: 1; min-width: 0; accent-color: var(--copper); }
  input[type=checkbox] { appearance: none; width: 48px; height: 28px; border-radius: 14px; background: #333a48; position: relative; transition: background .15s; flex: none; }
  input[type=checkbox]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .15s; }
  input[type=checkbox]:checked { background: var(--copper); }
  input[type=checkbox]:checked::after { left: 23px; }
  #update-status { color: var(--dim); font-size: 14px; }
  button.small { width: auto; min-height: 40px; padding: 0 16px; margin: 0; }
  button.back { margin-bottom: 4px; }
  #open-settings { margin-bottom: 14px; }
  #open-procs { margin: -8px 0 14px; }
  .proc { display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: 1px solid var(--line); }
  .proc:first-of-type { border-top: 0; }
  .proc div { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .proc small { display: block; color: var(--dim); }
  #procs-empty { color: var(--dim); }
</style>
</head>
<body>
<main>
  <h1>Rusty Popper <small id="ver"></small></h1>
  <section class="card" id="game">
    <div id="state" class="state">Connecting…</div>
    <img id="wheel" alt="" hidden>
    <div id="title"></div>
    <div id="sub"></div>
    <dl id="facts"></dl>
  </section>
  <section class="card" id="settings" hidden>
    <button class="small back" id="back">‹ Back</button>
    <h2>Wheel</h2>
    <div class="row"><label for="style">Wheel style</label>
      <select id="style" data-key="style">
        <option value="arc">Arc</option><option value="flow">Cover flow</option><option value="minimal">Minimal</option><option value="vertical">Vertical</option>
      </select></div>
    <h2>Attract mode</h2>
    <div class="row"><label for="attract">Attract mode</label><input type="checkbox" id="attract" data-key="attract"></div>
    <div class="row" data-needs="attract"><label for="attract_idle">Starts after</label><select id="attract_idle" data-key="attract_idle"></select></div>
    <div class="row" data-needs="attract"><label for="attract_interval">Time per game</label><select id="attract_interval" data-key="attract_interval"></select></div>
    <h2>Sound</h2>
    <div class="row"><label for="volume">Video volume</label><input type="range" id="volume" data-key="volume" min="0" max="100" step="10"><output for="volume"></output></div>
    <div class="row"><label for="sfx">Sound effects</label><input type="checkbox" id="sfx" data-key="sfx"></div>
    <div class="row" data-needs="sfx"><label for="sfx_volume">Effects volume</label><input type="range" id="sfx_volume" data-key="sfx_volume" min="0" max="100" step="10"><output for="sfx_volume"></output></div>
    <div class="row"><label for="game_audio">Game audio</label><input type="checkbox" id="game_audio" data-key="game_audio"></div>
    <div class="row" data-needs="game_audio"><label for="game_audio_volume">Game audio volume</label><input type="range" id="game_audio_volume" data-key="game_audio_volume" min="0" max="100" step="10"><output for="game_audio_volume"></output></div>
    <h2>Cabinet</h2>
    <div class="row"><label for="dof">DOF</label><input type="checkbox" id="dof" data-key="dof"></div>
    <h2>Updates</h2>
    <div class="row"><span id="update-status"></span><button class="small" id="update"></button></div>
  </section>
  <section class="card" id="procs" hidden>
    <button class="small back">‹ Back</button>
    <h2>Pinball processes</h2>
    <p>If a table or one of its helpers hangs, kill it here. Rusty Popper then goes back to the wheel.</p>
    <div id="proc-list"></div>
    <div id="procs-empty" hidden>None running.</div>
    <button id="kill-all" class="power" hidden>Kill all</button>
  </section>
  <section class="card" id="actions">
    <button id="open-settings" hidden>Settings</button>
    <button id="open-procs">Pinball processes</button>
    <button data-cmd="exit">Exit Rusty Popper</button>
    <button data-cmd="restart" class="power">Restart cabinet</button>
    <button data-cmd="shutdown" class="power">Shut down cabinet</button>
  </section>
  <div id="msg"></div>
</main>
<script>
"use strict";
const pin = new URLSearchParams(location.search).get("pin");
const q = pin ? "?pin=" + encodeURIComponent(pin) : "";
const $ = (id) => document.getElementById(id);
const labels = { menu: "On the wheel", launching: "Launching", playing: "Playing", exiting: "Exiting", other: "A table is running" };
let imageShown = -1, offline = false;

function clock(s) {
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0");
}

function fact(name, value) {
  if (value === null || value === undefined || value === "") return;
  const dt = document.createElement("dt"), dd = document.createElement("dd");
  dt.textContent = name;
  if (Array.isArray(value)) {
    dd.className = "tags";
    for (const t of value) { const s = document.createElement("span"); s.textContent = t; dd.appendChild(s); }
  } else dd.textContent = value;
  $("facts").append(dt, dd);
}

function show(s) {
  $("ver").textContent = "v" + s.version;
  const live = s.state !== "menu";
  $("state").textContent = (labels[s.state] || s.state) + (s.secs != null && live ? " · " + clock(s.secs) : "");
  $("state").className = "state" + (live ? " live" : "");
  const g = s.game;
  $("title").textContent = g ? g.title : (s.note || "");
  $("sub").textContent = g ? [g.manufacturer, g.year].filter(Boolean).join(" · ") : (s.state === "other" ? "Started outside Rusty Popper" : "");
  $("facts").replaceChildren();
  if (g) {
    fact("System", g.emulator);
    fact("ROM", g.rom);
    fact("File", g.file);
    fact("Tags", g.tags && g.tags.length ? g.tags : null);
  }
  if (s.image !== imageShown) {
    imageShown = s.image;
    const img = $("wheel");
    if (g) {
      img.onload = () => { img.hidden = false; };
      img.onerror = () => { img.hidden = true; };
      img.src = "/api/wheel.png" + q + (q ? "&" : "?") + "v=" + s.image;
    } else img.hidden = true;
  }
  document.querySelector('[data-cmd="exit"]').disabled = s.state === "launching" || s.state === "playing" || s.state === "exiting";
  if (s.settings && s.settings.style) { const first = !haveSettings; showSettings(s.settings); if (first) route(); }
}

// Settings: shown as the cabinet has them, except a control touched in the
// last few seconds (so a poll doesn't snap it back while it's being changed).
const touched = {};
const mins = (sec) => sec % 60 === 0 ? (sec / 60) + " min" : sec + " s";
function fillChoices(sel, values, label) {
  const want = values.join(",");
  if (sel.dataset.choices === want) return;
  sel.dataset.choices = want;
  sel.replaceChildren(...values.map((v) => { const o = document.createElement("option"); o.value = v; o.textContent = label(v); return o; }));
}
function showSettings(st) {
  haveSettings = true;
  $("open-settings").hidden = false;
  fillChoices($("attract_idle"), st.idle_choices, mins);
  fillChoices($("attract_interval"), st.interval_choices, (v) => v + " s");
  for (const el of document.querySelectorAll("[data-key]")) {
    const k = el.dataset.key;
    if (Date.now() - (touched[k] || 0) < 3000) continue;
    if (el.type === "checkbox") el.checked = !!st[k];
    else el.value = String(st[k]);
    const out = document.querySelector('output[for="' + k + '"]');
    if (out) out.textContent = st[k] + "%";
  }
  showDependents();
  // After a check from this page, "Checking" stays up long enough to read;
  // the status line then says how it went.
  if (checkedAt && st.update_state !== "checking" && Date.now() - checkedAt > 1500) checkedAt = 0;
  $("update-status").textContent = updateText(st);
  const u = $("update");
  u.hidden = !st.update_action;
  u.dataset.action = st.update_action;
  u.textContent = st.update_action === "install" ? "Install" : "Check";
}
// A setting that only matters while its switch is on hides with it off.
function showDependents() {
  for (const row of document.querySelectorAll("[data-needs]")) row.hidden = !$(row.dataset.needs).checked;
}
let haveSettings = false, checkedAt = 0;
function updateText(st) {
  if (st.update_state === "checking" || checkedAt) return "Checking for updates…";
  if (st.update_state === "none") return "No new updates (v" + $("ver").textContent.slice(1) + ")";
  return st.update;
}
// The Settings view replaces the main one; the phone's Back button returns.
function route() {
  const settings = location.hash === "#settings" && haveSettings, procs = location.hash === "#procs";
  $("settings").hidden = !settings;
  $("procs").hidden = !procs;
  for (const id of ["game", "actions"]) $(id).hidden = settings || procs;
  if (procs) pollProcs();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
$("open-settings").addEventListener("click", () => { location.hash = "settings"; });
$("open-procs").addEventListener("click", () => { location.hash = "procs"; });
for (const b of document.querySelectorAll("button.back")) b.addEventListener("click", () => { history.length > 1 ? history.back() : (location.hash = ""); });

// Pinball processes: read while that view is open; each Kill needs a second tap.
let procsTimer = 0, procsArmed = null;
async function pollProcs() {
  clearTimeout(procsTimer);
  if (location.hash !== "#procs") return;
  try {
    const r = await fetch("/api/procs" + q, { cache: "no-store" });
    if (r.ok) showProcs(await r.json());
  } catch (e) {}
  procsTimer = setTimeout(pollProcs, 2000);
}
function showProcs(list) {
  if (procsArmed) return; // don't redraw under a pending second tap
  $("proc-list").replaceChildren(...list.map((p) => {
    const row = document.createElement("div"), info = document.createElement("div"), b = document.createElement("button");
    row.className = "proc";
    info.textContent = p.name;
    const sm = document.createElement("small");
    sm.textContent = "Running " + clock(p.secs) + " · PID " + p.pid;
    info.appendChild(sm);
    b.className = "small power";
    b.textContent = "Kill";
    b.addEventListener("click", () => kill(b, String(p.pid), "Kill"));
    row.append(info, b);
    return row;
  }));
  $("procs-empty").hidden = list.length > 0;
  $("kill-all").hidden = list.length < 2;
}
async function kill(b, pid, label) {
  if (procsArmed !== b) {
    if (procsArmed) { procsArmed.classList.remove("armed"); procsArmed.textContent = procsArmed.dataset.label; }
    procsArmed = b;
    b.dataset.label = label;
    b.classList.add("armed");
    b.textContent = "Tap again";
    setTimeout(() => { if (procsArmed === b) { procsArmed = null; b.classList.remove("armed"); b.textContent = label; } }, 4000);
    return;
  }
  procsArmed = null;
  b.classList.remove("armed");
  b.disabled = true;
  say("Killing…");
  try {
    const r = await fetch("/api/kill" + q + (q ? "&" : "?") + "pid=" + pid, { method: "POST", headers: { "X-Rusty-Popper": "1" } });
    const t = await r.text();
    say(r.ok ? "Killed " + t + "." : t, !r.ok);
  } catch (e) { say("Couldn't reach the cabinet.", true); }
  b.disabled = false;
  pollProcs();
}
$("kill-all").addEventListener("click", () => kill($("kill-all"), "all", "Kill all"));

async function setting(key, value) {
  touched[key] = Date.now();
  try {
    const r = await fetch("/api/set" + q + (q ? "&" : "?") + "key=" + key + "&value=" + value, { method: "POST", headers: { "X-Rusty-Popper": "1" } });
    if (!r.ok) say(await r.text(), true);
    else say("");
  } catch (e) { say("Couldn't reach the cabinet.", true); }
}
for (const el of document.querySelectorAll("[data-key]")) {
  const k = el.dataset.key;
  if (el.type === "range") {
    el.addEventListener("input", () => { touched[k] = Date.now(); document.querySelector('output[for="' + k + '"]').textContent = el.value + "%"; });
    el.addEventListener("change", () => setting(k, el.value));
  } else if (el.type === "checkbox") {
    el.addEventListener("change", () => { touched[k] = Date.now(); showDependents(); setting(k, el.checked ? "on" : "off"); });
  } else {
    el.addEventListener("change", () => setting(k, el.value));
  }
}
$("update").addEventListener("click", () => {
  const install = $("update").dataset.action === "install";
  if (!install) { checkedAt = Date.now(); $("update-status").textContent = "Checking for updates…"; setTimeout(poll1, 1600); }
  if (install) say("Downloading the update. Rusty Popper restarts into it when no game is running.");
  setting("update", install ? "install" : "check");
});

// One extra status read (e.g. to show a check's result without waiting for the next poll).
async function poll1() {
  try { const r = await fetch("/api/status" + q, { cache: "no-store" }); if (r.ok) show(await r.json()); } catch (e) {}
}
let denied = false;
async function poll() {
  try {
    const r = await fetch("/api/status" + q, { cache: "no-store", signal: AbortSignal.timeout(4000) });
    // Wrong PIN or locked out: say why, and ask far less often, so an old
    // tab doesn't keep the cabinet locked for everyone.
    if (r.status === 403 || r.status === 429) { offline = true; denied = true; $("state").textContent = await r.text(); $("state").className = "state"; }
    else if (!r.ok) throw new Error(await r.text());
    else {
      denied = false;
      show(await r.json());
      if (offline) { offline = false; say(""); }
    }
  } catch (e) {
    offline = true;
    $("state").textContent = "Cabinet not reachable";
    $("state").className = "state";
  }
  setTimeout(poll, denied ? 30000 : document.hidden ? 10000 : 2000);
}

function say(text, err) { $("msg").textContent = text; $("msg").className = err ? "err" : ""; }

// Every button needs a second tap within 4 seconds.
let armed = null, armTimer = 0;
const names = { exit: "Exit Rusty Popper", restart: "Restart cabinet", shutdown: "Shut down cabinet" };
function disarm() {
  if (armed) { armed.classList.remove("armed"); armed.textContent = names[armed.dataset.cmd]; }
  armed = null;
  clearTimeout(armTimer);
}
for (const b of document.querySelectorAll("button[data-cmd]")) {
  b.addEventListener("click", async () => {
    if (armed !== b) {
      disarm();
      armed = b;
      b.classList.add("armed");
      b.textContent = "Tap again to " + names[b.dataset.cmd].toLowerCase();
      armTimer = setTimeout(disarm, 4000);
      return;
    }
    disarm();
    say("Sending…");
    try {
      const r = await fetch("/api/" + b.dataset.cmd + q, { method: "POST", headers: { "X-Rusty-Popper": "1" } });
      const t = await r.text();
      const live = $("state").classList.contains("live");
      if (r.ok) say(b.dataset.cmd === "exit" ? "Rusty Popper is closing." : (live ? "Closing the game, then " : "The cabinet is ") + (b.dataset.cmd === "restart" ? "restarting." : "shutting down."));
      else say(t, true);
    } catch (e) { say("Couldn't reach the cabinet.", true); }
  });
}
poll();
</script>
</body>
</html>
