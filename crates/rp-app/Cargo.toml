[package]
name = "rusty-popper"
description = "Fast alternate frontend for Pinup Popper (replaces PinUpMenu.exe)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rusty-popper"
path = "src/main.rs"

[dependencies]
rp-db.workspace = true
rp-config.workspace = true
rp-launch.workspace = true
anyhow = "1.0.104"
libloading = "0.9.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Media", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
log = "0.4"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
winit = "0.30.13"
glutin = "0.32.3"
glutin-winit = "0.5.0"
raw-window-handle = "0.6.2"
femtovg = "0.28.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"
toml_edit = "0.25.20"
glow = "0.18"

[build-dependencies]
winresource = "0.1.34"
