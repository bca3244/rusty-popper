[package]
name = "rusty-popper"
description = "Fast alternate frontend for Pinup Popper (replaces PinUpMenu.exe)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rusty-popper"
path = "src/main.rs"

[dependencies]
rp-db.workspace = true
rp-config.workspace = true
rp-launch.workspace = true
anyhow = "1.0.104"
libloading = "0.9.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }
