[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.37"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bca3244/rusty-popper"

[workspace.dependencies]
rp-db = { path = "crates/rp-db" }
rp-config = { path = "crates/rp-config" }
rp-launch = { path = "crates/rp-launch" }

# Whole-program optimisation for the shipped exe. Keep panic = "unwind": the
# logo loader catches panics from bad images and helper threads may panic.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Debug builds stay usable on the cabinet: optimise dependencies (image
# decoding, femtovg) even when our own code is built for debugging.
[profile.dev.package."*"]
opt-level = 2
