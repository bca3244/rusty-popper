[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.9"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bca3244/rusty-popper"
rust-version = "1.80"

[workspace.dependencies]
rp-db = { path = "crates/rp-db" }
rp-config = { path = "crates/rp-config" }
rp-launch = { path = "crates/rp-launch" }
